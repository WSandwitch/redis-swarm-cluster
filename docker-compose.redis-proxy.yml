version: "3.8"

x-common-variables:
  master-hostname: &master-hostname 'redis-node'
  master-nodes: &master-nodes 3
  redis-replicas: &redis-replicas 6
  redis-port: &redis-port 6389
  redis-mem: &redis-mem 2G
  redis-version: &redis-version 'wsandwitch/redis-cluster:v1.4'

networks:
  internal:

services:
  nodes:
    image: *redis-version
    build: .
    hostname: redis-node{{.Task.Slot}}
    restart: always
    environment:
      MASTER_HOST: *master-hostname
      REDIS_PORT: *redis-port
      REDIS_MAXMEM: *redis-mem
      SLOT_NUM: '{{.Task.Slot}}'
      SLOTS_TOTAL: *redis-replicas
      MASTERS_TOTAL: *master-nodes
      CHECK_PERIOD: 15
      BOOTSTRAP_TIMEOUT: 120
      BOOTSTRAP_STABLE: 10
      NODE_TIMEOUT: 15000
      REBALANCE: 1
      LOCK_TTL: 120
    networks:
     - internal
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    deploy:
      resources:
         limits:
           cpus: '2'
           memory: *redis-mem
      replicas: *redis-replicas
      placement:
        constraints:
         - "node.labels.LATENCY!=high"
         - "node.labels.MEM!=low"
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        order: stop-first
        delay: 15s
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0

  app:
    image: wsandwitch/redis-cluster-proxy:alpine3.20
    ports:
     - 6379:6379
    restart: always
    environment:
      MASTER_HOST: *master-hostname
      MASTER_PORT: *redis-port
      SLOTS_TOTAL: *redis-replicas
    networks:
     - internal
    entrypoint: /bin/sh
    command: -c "redis-cluster-proxy --port 6379 --connections-pool-size 60 --connections-pool-min-size 20 --enable-cross-slot $$(sh -c 'for i in $$(seq -s \" \" 1 $$SLOTS_TOTAL);do echo $$MASTER_HOST$$i:$$MASTER_PORT;done')"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw set a 1 | grep OK"]
    deploy:
      placement:
        constraints:
         - "node.labels.LATENCY!=high"
         - "node.labels.MEM!=low"
        max_replicas_per_node: 1
      replicas: 2
      restart_policy:
        condition: any
